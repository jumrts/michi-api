name: Pull Request

on: [pull_request]

jobs:
  check:
    name: Code Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"
          cache: true

      - name: Install Dependencies
        run: pdm install -G dev --frozen-lockfile

      - name: Run Format, Check and Test
        run: |
          export PYTHONPATH="$PYTHONPATH:$(pwd)/src"
          pdm run format
          pdm run check
