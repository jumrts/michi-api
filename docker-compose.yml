name: api-michi
services:
  api:
    container_name: michi-api
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
    - ./src:/app/src
    depends_on:
      - postgres

  postgres:
    image: postgres:17.10
    container_name: postgres-michi
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: